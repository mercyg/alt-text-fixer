# Copy this file to .github/workflows/alt-text.yml in YOUR repo.
# Add a repo secret named GEMINI_API_KEY (Settings > Secrets and variables > Actions).
name: Alt text
on:
  workflow_dispatch:        # run it from the Actions tab
  push:
    branches: [main]
    paths: ["**.md", "**.mdx", "**.html"]
permissions:
  contents: write
  pull-requests: write
jobs:
  alt-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mercyg/alt-text-fixer@master
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
