name: "Alt Text Fixer"
description: "Find images with missing or useless alt text and write real descriptions with Gemma 4."
author: "Meheret Egzerab"
branding:
  icon: "eye"
  color: "blue"
inputs:
  gemini-api-key:
    description: "Gemini API key (store it as a repo secret)"
    required: true
  model:
    description: "Gemma 4 model id"
    default: "gemma-4-26b-a4b-it"
  path:
    description: "Folder to scan, relative to the repo root"
    default: "."
  open-pr:
    description: "true = write fixes and open a pull request; false = only report the diff"
    default: "true"
  include-remote:
    description: "Also describe images hosted at URLs"
    default: "false"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install
      shell: bash
      run: pip install -q requests google-genai
    - name: Fix alt text
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        ALT_BACKEND: gemini
        ALT_GEMINI_MODEL: ${{ inputs.model }}
        PYTHONWARNINGS: ignore
      run: |
        FLAGS=""
        [ "${{ inputs.open-pr }}" != "true" ] && FLAGS="$FLAGS --dry-run"
        [ "${{ inputs.include-remote }}" = "true" ] && FLAGS="$FLAGS --include-remote"
        python "${{ github.action_path }}/alt_text_fixer.py" "${{ inputs.path }}" $FLAGS > alt-text.diff
        { echo "## ♿ Alt Text Fixer"; echo '```diff'; cat alt-text.diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        rm alt-text.diff
    - name: Open pull request
      if: inputs.open-pr == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        branch: docs/alt-text
        commit-message: "docs: add descriptive alt text for screen readers"
        title: "docs: add descriptive alt text for screen readers"
        body: |
          Images in the docs were missing alt text (or had generic alt like "screenshot"), so screen reader users heard only "image".
          This PR adds descriptions written by Gemma 4 using each image and its surrounding docs. Please skim them before merging.

          Generated by [Alt Text Fixer](https://github.com/mercyg/alt-text-fixer).

